<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>csv-checkup</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0b0b0b; --surface:#151515; --surface-2:#1d1d1d; --border:#2e2e2e; --text:#f2f2f2; --muted:#a3a3a3;
  --accent:#5fd068; --accent-ink:#06210b; --bad:#ff6b5e;
  --mono:ui-monospace,Consolas,monospace; --ui:system-ui,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ui);line-height:1.55}
.wrap{max-width:960px;margin:0 auto;padding:0 16px 70px}
/* header section with the farmland image. Save a photo as hero.jpg in this folder to replace the drawing. */
.hero{color:#fff;padding:54px 16px 46px;
  background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.78)),url(hero.jpg) center/cover no-repeat,url(fields.svg) center/cover no-repeat}
.hero-in{max-width:960px;margin:0 auto;padding:0 16px}
.hero h1{font-size:clamp(28px,5vw,38px);margin:0 0 8px;line-height:1.15;font-weight:700}
.hero p{margin:0;max-width:62ch;color:#e3e3e3}
.eyebrow{font-size:14px;color:#cfcfcf;margin-bottom:6px}
.muted{color:var(--muted)} .small{font-size:13px}
.drop{margin-top:24px;border:1px dashed var(--border);border-radius:6px;background:var(--surface);padding:26px 18px;text-align:center}
.drop.over{border-color:var(--accent)}
.btn{font:inherit;font-weight:600;font-size:14px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:6px;padding:9px 16px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:14px}
.lock{display:inline-block;margin-top:14px;font-size:13px;color:var(--muted)}
#status{margin-top:16px;font-size:14px;color:var(--muted);min-height:20px}
#status.err{color:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:14px}
.tile b{display:block;font-size:26px;line-height:1.15}
.group{margin-top:16px;background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.group-h{display:flex;gap:10px;align-items:baseline;padding:11px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tag{font-family:var(--mono);font-size:12px;color:var(--muted)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
th{font-size:13px;font-weight:600;color:var(--muted);background:var(--surface-2)}
td.n{white-space:nowrap}
code{font-family:var(--mono);background:var(--surface-2);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:.92em;white-space:pre-wrap;word-break:break-word}
.clean{margin-top:22px;border:1px solid var(--accent);border-radius:6px;padding:18px;text-align:center}
footer{margin-top:34px;font-size:13px;color:var(--muted)}
footer a{color:var(--accent)}
</style>
</head>
<body>
<header class="hero"><div class="hero-in">
  <div class="eyebrow">csv-checkup · data-quality report for any CSV</div>
  <h1>Data Cleaning Report</h1>
  <p>Analysis runs the following checks: messy headers, stray spaces, placeholders, empty cells, duplicate rows, labels spelled several ways, text in number columns, outliers and mixed date formats.</p>
</div></header>
<div class="wrap">

  <div class="drop" id="drop">
    <div><b>Drag a .csv file here</b> <span class="muted">or</span></div>
    <div class="row">
      <button class="btn pri" id="pick">Upload new</button>
      <button class="btn" id="demo">Try an example</button>
      <input type="file" id="file" accept=".csv,text/csv" hidden>
    </div>
  </div>
  <div id="status"></div>
  <div id="out"></div>

</div>

<!--EMBED-->
<script>window.EMBED = {"py": "\"\"\"csv-checkup: point it at ANY csv file and it reports data-quality problems.\n\n    python validate.py some_file.csv\n    python validate.py some_file.csv --csv report.csv     (also save the report)\n\nNo check mentions a column by name, so it works on files it has never seen.\nIt never changes the input file. It only reports.\n\"\"\"\nimport re\nimport sys\n\nimport pandas as pd\n\n# Words people type when they mean \"no value\"\nPLACEHOLDERS = {\"n/a\", \"na\", \"nan\", \"nil\", \"null\", \"none\", \"-\", \"--\", \"?\"}\n\n# Shapes a date can take. Each cell is matched against these in order.\nDATE_SHAPES = {\n    \"YYYY-MM-DD\": r\"\\d{4}-\\d{1,2}-\\d{1,2}\",\n    \"DD.MM.YYYY\": r\"\\d{1,2}\\.\\d{1,2}\\.\\d{4}\",\n    \"DD/MM/YYYY\": r\"\\d{1,2}/\\d{1,2}/\\d{2,4}\",\n    \"Mon-YYYY\": r\"[A-Za-z]{3,9}-\\d{4}\",\n    \"Mon-YY\": r\"[A-Za-z]{3,9}-\\d{2}\",\n    \"DD-Mon\": r\"\\d{1,2}-[A-Za-z]{3,9}\",\n}\nTIME_PART = r\"([ T]\\d{1,2}:\\d{2}(:\\d{2})?)?\"\n\n\n# ---------------------------------------------------------------- helpers\ndef load(source):\n    \"\"\"Read every cell as text, exactly as typed, so nothing is hidden or converted.\"\"\"\n    try:\n        return pd.read_csv(source, dtype=str, keep_default_na=False)\n    except UnicodeDecodeError:                             # older files are often not UTF-8\n        return pd.read_csv(source, dtype=str, keep_default_na=False, encoding=\"latin-1\")\n\n\ndef finding(check, col, bad, df, message):\n    \"\"\"Build one line of the report. `bad` marks the problem cells in column `col`.\"\"\"\n    return {\n        \"check\": check,\n        \"column\": col,\n        \"count\": int(bad.sum()),\n        \"rows\": (df.index[bad] + 2).tolist()[:5],          # +2 = row number in a spreadsheet\n        \"examples\": df.loc[bad, col].unique()[:3].tolist(),\n        \"message\": message,\n    }\n\n\ndef has_value(series):\n    \"\"\"True for cells that hold real content (not empty, not a placeholder).\"\"\"\n    clean = series.str.strip()\n    return (clean != \"\") & ~clean.str.lower().isin(PLACEHOLDERS)\n\n\ndef as_numbers(series):\n    \"\"\"Turn text into numbers where possible ('1,200' -> 1200). Anything else becomes NaN.\"\"\"\n    return pd.to_numeric(series.str.strip().str.replace(\",\", \"\", regex=False), errors=\"coerce\")\n\n\ndef is_numeric_column(series):\n    \"\"\"A column counts as numeric when at least 80% of its real values are numbers.\"\"\"\n    real = has_value(series)\n    if real.sum() == 0:\n        return False\n    return as_numbers(series[real]).notna().mean() >= 0.8\n\n\n# ---------------------------------------------------------------- checks\n# Every check takes the whole table and returns a list of findings.\n\ndef check_messy_headers(df):\n    \"\"\"Column names with stray spaces, e.g. ' date' or 'RAIN( mm)'.\"\"\"\n    out = []\n    for col in df.columns:\n        name = str(col)\n        problems = []\n        if name != \" \".join(name.split()):\n            problems.append(\"stray or doubled spaces\")\n        if re.search(r\"\\(\\s|\\s\\)\", name):\n            problems.append(\"space inside brackets\")\n        if name.startswith(\"Unnamed:\") or name.strip() == \"\":\n            problems.append(\"no name\")\n        if problems:\n            out.append({\"check\": \"messy_header\", \"column\": name, \"count\": 1, \"rows\": [1],\n                        \"examples\": [name], \"message\": \"Header has \" + \" and \".join(problems)})\n    return out\n\n\ndef check_padded_text(df):\n    \"\"\"Cells with spaces before or after the value, like ' Maize  '.\"\"\"\n    out = []\n    for col in df.columns:\n        bad = df[col] != df[col].str.strip()\n        if bad.any():\n            out.append(finding(\"padded_text\", col, bad, df, \"Spaces before or after the value\"))\n    return out\n\n\ndef check_placeholders(df):\n    \"\"\"Cells holding a stand-in for 'no value', like n/a or -.\"\"\"\n    out = []\n    for col in df.columns:\n        bad = df[col].str.strip().str.lower().isin(PLACEHOLDERS)\n        if bad.any():\n            out.append(finding(\"placeholder\", col, bad, df, \"Placeholder instead of a value\"))\n    return out\n\n\ndef check_empty_cells(df):\n    \"\"\"Cells with nothing in them.\"\"\"\n    out = []\n    for col in df.columns:\n        bad = df[col].str.strip() == \"\"\n        if bad.any():\n            out.append(finding(\"empty_cell\", col, bad, df, \"Empty cell\"))\n    return out\n\n\ndef check_duplicate_rows(df):\n    \"\"\"Rows that repeat an earlier row exactly.\"\"\"\n    bad = df.duplicated(keep=\"first\")\n    if not bad.any():\n        return []\n    return [{\"check\": \"duplicate_row\", \"column\": \"(whole row)\", \"count\": int(bad.sum()),\n             \"rows\": (df.index[bad] + 2).tolist()[:5], \"examples\": [],\n             \"message\": \"Row repeats an earlier row\"}]\n\n\ndef check_label_variants(df):\n    \"\"\"One label written several ways: 'Kenya', 'kenya ', 'Kenya.'\"\"\"\n    out = []\n    for col in df.columns:\n        if is_numeric_column(df[col]):\n            continue\n        real = has_value(df[col])\n        # The \"key\" is the label with case, spacing and end punctuation ignored.\n        key = df[col].str.lower().str.split().str.join(\" \").str.strip(\" .,;:\")\n        bad = pd.Series(False, index=df.index)\n        for _, group in df.loc[real, col].groupby(key[real]):\n            if group.nunique() > 1:\n                most_common = group.value_counts().idxmax()\n                bad |= real & (key == key[group.index[0]]) & (df[col] != most_common)\n        if bad.any():\n            out.append(finding(\"label_variant\", col, bad, df, \"Same label written in more than one way\"))\n    return out\n\n\ndef check_text_in_numbers(df):\n    \"\"\"Text sitting in a column that is otherwise numbers.\"\"\"\n    out = []\n    for col in df.columns:\n        if not is_numeric_column(df[col]):\n            continue\n        bad = has_value(df[col]) & as_numbers(df[col]).isna()\n        if bad.any():\n            out.append(finding(\"text_in_numbers\", col, bad, df, \"Text in a numeric column\"))\n    return out\n\n\ndef check_outliers(df):\n    \"\"\"Numbers far outside the rest of their column (beyond 3 x the interquartile range).\"\"\"\n    out = []\n    for col in df.columns:\n        if not is_numeric_column(df[col]):\n            continue\n        nums = as_numbers(df[col])\n        base = nums[nums.notna() & (nums != 0)]            # zeros often mean \"none\", so leave them out\n        if len(base) < 5:\n            continue\n        q1, q3 = base.quantile(0.25), base.quantile(0.75)\n        spread = q3 - q1\n        if spread == 0:\n            continue\n        bad = nums.notna() & (nums != 0) & ((nums < q1 - 3 * spread) | (nums > q3 + 3 * spread))\n        if bad.any():\n            out.append(finding(\"outlier\", col, bad, df, \"Value far outside the rest of the column\"))\n    return out\n\n\ndef check_mixed_dates(df):\n    \"\"\"A date column that uses more than one date format.\"\"\"\n    out = []\n    for col in df.columns:\n        real = has_value(df[col])\n        if real.sum() == 0:\n            continue\n        shape = pd.Series(\"\", index=df.index)\n        for name, pattern in DATE_SHAPES.items():\n            hit = real & (shape == \"\") & df[col].str.strip().str.fullmatch(pattern + TIME_PART)\n            shape[hit] = name\n        if (shape[real] != \"\").mean() < 0.8 or shape[real].nunique() < 2:\n            continue                                       # not a date column, or only one format\n        usual = shape[real & (shape != \"\")].value_counts().idxmax()\n        bad = real & (shape != usual)\n        out.append(finding(\"mixed_dates\", col, bad, df, f\"Date not in the column's usual format ({usual})\"))\n    return out\n\n\nCHECKS = [\n    check_messy_headers,\n    check_padded_text,\n    check_placeholders,\n    check_empty_cells,\n    check_duplicate_rows,\n    check_label_variants,\n    check_text_in_numbers,\n    check_outliers,\n    check_mixed_dates,\n]\n\n\ndef run_checks(df):\n    findings = []\n    for check in CHECKS:\n        findings += check(df)\n    return findings\n\n\n# ---------------------------------------------------------------- run\ndef main():\n    args = sys.argv[1:]\n    if not args or args[0] in (\"-h\", \"--help\"):\n        print(\"Usage: python validate.py yourfile.csv [--csv report.csv]\")\n        sys.exit(1)\n    path = args[0]\n    df = load(path)\n    findings = run_checks(df)\n\n    print(f\"{path}: {len(df)} rows, {len(df.columns)} columns\\n\")\n    for f in findings:\n        print(f\"[{f['check']}] column '{f['column']}': {f['count']} cells. {f['message']}.\")\n        print(f\"    rows {f['rows']}  examples {f['examples']}\")\n    cells = sum(f[\"count\"] for f in findings)\n    print(f\"\\n{len(findings)} findings covering {cells} cells\")\n\n    if \"--csv\" in args:\n        out = args[args.index(\"--csv\") + 1]\n        pd.DataFrame(findings).to_csv(out, index=False)\n        print(f\"Report saved to {out}\")\n\n\nif __name__ == \"__main__\":\n    main()\n", "csv": "COUNTY,DATE,COMMODITY TYPE,HOUSE HOLD STOCK(Tonnes),PRODUCTION ESTIMATES( Tonnes),MILLERS(Tonnes),TRADERS( Tonnes),NATIONAL CEREALS PRODUCE BOARD( Tonnes),CROP STAGE,CROP CONDITIONS,REMARKS\nKisumu,Oct-2016, Maize       ,4401,9135,4500,10312,0,Germination and weeding,Poor due to prolonged drought,Drought made planting to be haulted by most farmers\nKisumu,Oct-2016, Wheat       ,0,0,0,0,0,No Crop,No Crop,N/A\nKisumu,Oct-2016, Rice        ,245,130,2607,846,0,\"booting, vegetative\",Poor due to prolonged drought,Doing   well  with irrigation and. Computation of stocks held by NCPB is done at national level. \nKisumu,Oct-2016, Beans       ,406,520,0,2611,0,Germination and weeding,Poor due to prolonged drought,Drought made planting to be haulted by most farmers\nKisumu,Oct-2016, Millet      ,0,0,0,0,0,No Crop,No Crop,N/A\nKisumu,Oct-2016, Sorghum     ,382,139,0,488,0,Germination and weeding,Poor due to prolonged drought,Drought made planting to be haulted by most farmers\nKisumu,Oct-2016, Barley      ,0,0,0,0,0,No Crop,No Crop,N/A\nKisumu,Oct-2016, Peas dry    ,0,0,0,0,0,No Crop,No Crop,N/A\nKisumu,Oct-2016, Chick peas  ,0,0,0,0,0,No Crop,No Crop,N/A\nKisumu,Oct-2016, Cow peas    ,0,0,0,0,0,No Crop,No Crop,N/A\nKisumu,Oct-2016, Pigeon peas ,0,0,0,0,0,No Crop,No Crop,N/A\nKisumu,Oct-2016, Green grams ,0,0,0,0,0,No Crop,No Crop,N/A\nKisumu,Sep-2016, Maize       ,6286,9346,4500,10706,0,Completed harvesting,Affecteted by a three weeks drought,N/A\nKisumu,Sep-2016, Wheat       ,0,0,0,0,0,No Crop,No Crop,N/A\nKisumu,Sep-2016, Rice        ,288,4240,3256,823,0,Vegatative,Good,Doing   well  with irrigation and. Computation of stocks held by NCPB is done at national level. \nKisumu,Sep-2016, Beans       ,607,4231,0,2907,0,Completed harvesting,Poor,Drought set in at critical stages of growth . Computation of stocks held by NCPB is done at national level\nKisumu,Sep-2016, Millet      ,0,0,0,0,0,No Crop,No Crop,N/A\nKisumu,Sep-2016, Sorghum     ,750,4020,0,371,0,Completed harvesting,Poor,Drought set in at critical stages of growth . Computation of stocks held by NCPB is done at national level\nKisumu,Sep-2016, Barley      ,0,0,0,0,0,No Crop,No Crop,N/A\nKisumu,Sep-2016, Peas dry    ,0,0,0,0,0,No Crop,No Crop,N/A\nKisumu,Sep-2016, Chick peas  ,0,0,0,0,0,No Crop,No Crop,N/A\nKisumu,Sep-2016, Cow peas    ,0,0,0,0,0,No Crop,No Crop,N/A\nKisumu,Sep-2016, Pigeon peas ,0,0,0,0,0,No Crop,No Crop,N/A\nKisumu,Sep-2016, Green grams ,0,0,0,0,0,No Crop,No Crop,N/A\nKisumu,Aug-2016, Maize       ,4418,9346,4500,9893,0,Harvesting,Affecteted by a three weeks drought,Drought set in at critical stages of growth . Computation of stocks held by NCPB is done at national level. Harvesting continues\nKisumu,Aug-2016, Wheat       ,0,0,0,0,0,No Crop,No Crop,N/A\nKisumu,Aug-2016, Rice        ,344,7440, <script>
const $ = s => document.querySelector(s);
const status = (msg, err) => { const e = $('#status'); e.textContent = msg; e.className = err ? 'err' : ''; };
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

const LABELS = {
  messy_header: 'Messy headers', padded_text: 'Stray spaces around values', placeholder: 'Placeholders instead of values',
  empty_cell: 'Empty cells', duplicate_row: 'Duplicate rows', label_variant: 'One label written several ways',
  text_in_numbers: 'Text in number columns', outlier: 'Outliers', mixed_dates: 'Mixed date formats'
};

// Load a file from the server when there is one; otherwise use the copy built into this page.
async function getText(url, key) {
  if (location.protocol !== 'file:') {
    try { const r = await fetch(url); if (r.ok) return await r.text(); } catch (e) {}
  }
  if (window.EMBED && window.EMBED[key]) return window.EMBED[key];
  throw new Error('could not load ' + url);
}

let pyReady = null;
function loadPython() {
  if (pyReady) return pyReady;
  pyReady = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js';
    s.onload = async () => {
      try {
        const py = await loadPyodide();
        await py.loadPackage('pandas');
        const code = await getText('validate.py', 'py');
        py.FS.writeFile('validate.py', code);
        py.runPython('import json, validate');
        resolve(py);
      } catch (e) { pyReady = null; reject(e); }
    };
    s.onerror = () => { pyReady = null; reject(new Error('Could not download the Python engine. Check your connection.')); };
    document.head.appendChild(s);
  });
  return pyReady;
}

async function check(name, bytes) {
  $('#out').replaceChildren();
  status(pyReady ? 'Checking ' + name + '…' : 'Loading Python and Pandas (first run only, 10 to 20 seconds)…');
  let py;
  try { py = await loadPython(); }
  catch (e) { status('Could not start the checker: ' + (e.message || e) + '. An internet connection is needed the first time.', true); return; }
  try {
    status('Checking ' + name + '…');
    py.FS.writeFile('input.csv', bytes);
    const res = JSON.parse(py.runPython(
      'df = validate.load("input.csv")\n' +
      'json.dumps({"rows": len(df), "cols": len(df.columns), "findings": validate.run_checks(df)})'));
    render(name, res);
    status('');
  } catch (e) {
    const last = String(e.message || e).trim().split('\n').pop();
    status('Could not read that file as a CSV: ' + last, true);
  }
}

function render(name, res) {
  const out = $('#out'), f = res.findings, cells = f.reduce((a, x) => a + x.count, 0);
  const tiles = el('div', 'tiles');
  [[res.rows, 'rows'], [res.cols, 'columns'], [f.length, 'findings'], [cells, 'cells affected']].forEach(([n, l]) => {
    const t = el('div', 'tile'); t.append(el('b', null, n.toLocaleString()), el('span', 'muted small', l)); tiles.append(t);
  });
  const rh = el('h2', null, 'Report: ' + name); rh.style.cssText = 'font-size:18px;margin:26px 0 0';
  out.append(rh, tiles);

  if (!f.length) { const c = el('div', 'clean'); c.append(el('b', null, 'No findings.'), el('div', 'muted small', 'None of the nine checks found a problem. That does not prove the numbers are right, only that the file is tidy.')); out.append(c); return; }

  const groups = {};
  f.forEach(x => (groups[x.check] = groups[x.check] || []).push(x));
  for (const k in groups) {
    const g = el('div', 'group'), h = el('div', 'group-h');
    h.append(el('b', null, LABELS[k] || k), el('span', 'tag', k), el('span', 'muted small', groups[k][0].message.replace(/\s*\(.*\)$/, '')));
    const table = el('table'), head = el('tr');
    ['Column', 'Cells', 'Spreadsheet rows', 'Examples'].forEach(t => head.append(el('th', null, t)));
    table.append(head);
    groups[k].forEach(x => {
      const tr = el('tr'), ex = el('td');
      x.examples.forEach((v, i) => { if (i) ex.append(' '); ex.append(el('code', null, v === '' ? '(empty)' : v)); });
      const colTd = el('td'); colTd.append(el('code', null, x.column));
      tr.append(colTd, el('td', 'n', x.count.toLocaleString()), el('td', 'n', x.rows.join(', ') + (x.count > x.rows.length ? ', …' : '')), ex);
      table.append(tr);
    });
    const sc = el('div', 'scroll'); sc.append(table); g.append(h, sc); out.append(g);
  }

  const dl = el('button', 'btn', 'Download this report as CSV');
  dl.style.marginTop = '18px';
  dl.onclick = () => {
    const q = v => '"' + String(v).replace(/"/g, '""') + '"';
    const lines = ['check,column,count,rows,examples,message'].concat(f.map(x => [x.check, x.column, x.count, x.rows.join(' '), x.examples.join(' | '), x.message].map(q).join(',')));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([lines.join('\n')], { type: 'text/csv' }));
    a.download = 'qc_report.csv'; a.click();
  };
  out.append(dl);
}

const fileIn = $('#file'), drop = $('#drop');
$('#pick').onclick = () => fileIn.click();
fileIn.onchange = async () => { const f = fileIn.files[0]; if (f) check(f.name, new Uint8Array(await f.arrayBuffer())); fileIn.value = ''; };
$('#demo').onclick = async () => {
  try { const t = await getText('Kisumu_Crop_County_Data_2014-2016.csv', 'csv'); check('Kisumu_Crop_County_Data_2014-2016.csv', new TextEncoder().encode(t)); }
  catch (e) { status('Could not load the example: ' + e.message, true); }
};
['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', async e => { const f = e.dataTransfer.files[0]; if (f) check(f.name, new Uint8Array(await f.arrayBuffer())); });
</script>
